# Energy replication of the 2x2 wording x payoff design, cell D (added, post hoc) -
# protocol amendment 8 (v1.8), frozen 2026-10-24 before it is run. Everything except
# `name` and `systems` is identical to energy_llm_prompt_control.yaml (and so to
# energy_llm_main.yaml); `systems` is identical to pharma_llm_prompt_control_d.yaml.
# D = condition A's wording with condition C's payoff.
name: energy_llm_prompt_control_d
experiment: energy_llm_main
system: llm_main
domain: energy
seeds:
- 0
- 1
- 2
- 3
- 4
compact_output: true
dataset_files:
- data/raw/energy/Case_Study_OptiREC.xlsx
reference:
  c_rate: 0.5
  round_trip_efficiency: 0.9
  soc_min: 0.1
  soc_max: 0.9
  soc_start: 0.5
  idle_band: 0.05
model:
  n_estimators: 100
  max_depth: 6
game:
  n_rounds: 200
  eval_last: 200
  top_k: 2
  deviation_threshold: 0.25
  inflation: 0.3
  epsilon: 0.1
  learning_rate: 0.1
  q_init: 0.5
  omega: 0.5
  consistency_neighbours: 5
llm:
  model: qwen2.5:7b
  digest: 845dbda0ea48ed749caafd9e6037047aa19acfcfd82e704d7ca97d631a0b697e
  temperature: 0.0
  num_ctx: 2048
  num_predict: 120
  workers: 5
  prompt_style: raw
systems:
  payoff_only:
    components:
      game: true
      xai: true
      explanation_aware_incentive: true
      reputation: true
      blockchain: false
    incentive_weights:
      alpha: 0.3
      beta: 0.25
      gamma: 0.15
      delta: 0.1
      lambda: 0.2
    reputation:
      initial: 0.5
      rho: 0.8
    reward:
      degenerate_value: 0.5
    show_audit: true
    stated_rules:
      components:
        game: true
        xai: true
        explanation_aware_incentive: false
        reputation: false
        blockchain: false
      incentive_weights:
        alpha: 0.75
        beta: 0.0
        gamma: 0.0
        delta: 0.25
        lambda: 0.0
