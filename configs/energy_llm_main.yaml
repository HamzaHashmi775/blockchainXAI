  round_trip_efficiency: 0.9
  soc_min: 0.1
  soc_max: 0.9
  soc_start: 0.5
  idle_band: 0.05
model:
  n_estimators: 100
  max_depth: 6
game:
  n_rounds: 200
  eval_last: 200
  top_k: 2
  deviation_threshold: 0.25
  inflation: 0.3
  epsilon: 0.1
  learning_rate: 0.1
  q_init: 0.5
  omega: 0.5
  consistency_neighbours: 5
llm:
