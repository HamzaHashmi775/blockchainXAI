# LLM-agent experiment. Values are frozen in docs/research_protocol.md, amendment 4
# (v1.4, 2026-10-11); changing them requires a logged amendment.
# Mechanism parameters are identical to the classical configs.
name: energy_llm_main
experiment: energy_llm_main
system: llm_main
domain: energy
seeds:
- 0
- 1
- 2
- 3
- 4
compact_output: true
dataset_files:
- data/raw/energy/Case_Study_OptiREC.xlsx
reference:
